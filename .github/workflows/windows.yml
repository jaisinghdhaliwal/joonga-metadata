name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, verify ExifTool, and run regression checks
        shell: pwsh
        run: ./Build.ps1 -Runtime ${{ matrix.runtime }}
      - name: Smoke test native window and capture UI
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'build/win-x64/Joonga Tag/Joonga Tag.exe'
          $process = Start-Process $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
            throw 'UI smoke test timed out.'
          }
          if ($process.ExitCode -ne 0) { throw "UI smoke test failed: $($process.ExitCode)" }
      - name: Smoke test Windows 11 installer UI and silent install/uninstall
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          $setup = Join-Path $PWD 'build/Joonga-Tag-Windows-win-x64-Setup.exe'
          $setupSmoke = Start-Process $setup -ArgumentList '--smoke-test' -PassThru
          if (-not $setupSmoke.WaitForExit(120000)) {
            Stop-Process -Id $setupSmoke.Id -ErrorAction SilentlyContinue
            throw 'Installer UI smoke test timed out.'
          }
          if ($setupSmoke.ExitCode -ne 0) { throw "Installer UI smoke test failed: $($setupSmoke.ExitCode)" }
          $installerResults = Join-Path $PWD 'build/InstallerSmokeResults'
          $targetResults = Join-Path $PWD 'build/win-x64/Joonga Tag/SmokeResults/Installer'
          if (Test-Path -LiteralPath $installerResults) {
            New-Item -ItemType Directory -Force $targetResults | Out-Null
            Copy-Item -Path (Join-Path $installerResults '*') -Destination $targetResults -Recurse -Force
          }

          $installDir = Join-Path $env:RUNNER_TEMP 'JoongaTagInstallTest'
          if (Test-Path -LiteralPath $installDir) { Remove-Item -LiteralPath $installDir -Recurse -Force }
          $installProc = Start-Process $setup -ArgumentList @('--quiet', '--install', '--dir', "`"$installDir`"", '--scope', 'user', '--start-menu', 'true', '--desktop', 'false') -PassThru
          if (-not $installProc.WaitForExit(120000)) {
            Stop-Process -Id $installProc.Id -ErrorAction SilentlyContinue
            throw 'Silent install timed out.'
          }
          if ($installProc.ExitCode -ne 0) { throw "Silent install failed: $($installProc.ExitCode)" }

          $installedExe = Join-Path $installDir 'Joonga Tag.exe'
          $installedExif = Join-Path $installDir 'tools\exiftool.exe'
          $startMenuShortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Joonga Tag.lnk'
          $regPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\JoongaTag'
          if (-not (Test-Path -LiteralPath $installedExe)) { throw 'Installed executable missing.' }
          if (-not (Test-Path -LiteralPath $installedExif)) { throw 'Installed ExifTool missing.' }
          if (-not (Test-Path -LiteralPath $startMenuShortcut)) { throw 'Start Menu shortcut missing.' }
          if (-not (Test-Path -LiteralPath $regPath)) { throw 'Uninstall registry entry missing.' }

          $unrelatedFile = Join-Path $installDir 'keep-me.txt'
          Set-Content -LiteralPath $unrelatedFile -Value 'This file did not ship with the app.'
          $testRoaming = Join-Path $env:RUNNER_TEMP 'JoongaTagTestRoaming'
          $testLocal = Join-Path $env:RUNNER_TEMP 'JoongaTagTestLocal'
          $testSettings = Join-Path $testRoaming 'Joonga Tag'
          $testCache = Join-Path $testLocal 'Joonga Tag'
          New-Item -ItemType Directory -Force $testSettings, $testCache | Out-Null
          Set-Content -LiteralPath (Join-Path $testSettings 'Settings.json') -Value '{}'
          Set-Content -LiteralPath (Join-Path $testCache 'cache.txt') -Value 'test'
          $uninstallProc = Start-Process $installedExe -ArgumentList @('--uninstall', '--quiet', '--remove-data', '--user-appdata', "`"$testRoaming`"", '--user-localappdata', "`"$testLocal`"") -PassThru
          if (-not $uninstallProc.WaitForExit(120000)) {
            Stop-Process -Id $uninstallProc.Id -ErrorAction SilentlyContinue
            throw 'Silent uninstall timed out.'
          }
          if ($uninstallProc.ExitCode -ne 0) { throw "Silent uninstall failed: $($uninstallProc.ExitCode)" }

          $deadline = (Get-Date).AddSeconds(20)
          while (((Test-Path -LiteralPath $installedExe) -or (Test-Path -LiteralPath $testSettings) -or (Test-Path -LiteralPath $testCache)) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path -LiteralPath $startMenuShortcut) { throw 'Start Menu shortcut was not removed.' }
          if (Test-Path -LiteralPath $regPath) { throw 'Uninstall registry entry was not removed.' }
          if ((Test-Path -LiteralPath $installedExe) -or (Test-Path -LiteralPath $installedExif) -or (Test-Path -LiteralPath (Join-Path $installDir 'JoongaTag.install-files.txt'))) { throw 'Packaged files were not removed.' }
          if ((Test-Path -LiteralPath $testSettings) -or (Test-Path -LiteralPath $testCache)) { throw 'App data was not removed.' }
          if (-not (Test-Path -LiteralPath $unrelatedFile)) { throw 'Uninstall removed an unrelated file.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Joonga-Tag-Windows-${{ matrix.runtime }}
          path: |
            windows/build/Joonga-Tag-Windows-${{ matrix.runtime }}.zip
            windows/build/Joonga-Tag-Windows-${{ matrix.runtime }}-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.runtime == 'win-x64' && always()
        with:
          name: Windows-UI-smoke-results
          path: windows/build/win-x64/Joonga Tag/SmokeResults/
