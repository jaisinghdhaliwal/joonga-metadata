<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Joonga Metadata Windows icon</title>
  <desc>A coral metadata tag over a paper tag on a transparent background.</desc>
  <defs>
    <linearGradient id="coral" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="113" y2="355">
      <stop stop-color="#FF6D64"/>
      <stop offset="1" stop-color="#F9423A"/>
    </linearGradient>
    <path id="tag" d="M48 280H394C409 280 417 276 427 267L530 175C552 156 552 124 530 105L427 13C417 4 409 0 394 0H48C21 0 0 21 0 48V232C0 259 21 280 48 280Z"/>
    <clipPath id="paper">
      <use href="#tag" x="222" y="319"/>
    </clipPath>
    <mask id="tag-hole" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="white"/>
      <circle cx="687" cy="569" r="31" fill="black"/>
    </mask>
  </defs>
  <g transform="translate(512 512) scale(1.64) translate(-512 -514)" mask="url(#tag-hole)">
    <use href="#tag" x="222" y="319" fill="#F7F6F3" stroke="#BCB8B0" stroke-width="5"/>
    <use href="#tag" x="258" y="409" fill="#000000" opacity=".12" clip-path="url(#paper)"/>
    <use href="#tag" transform="translate(258 429)" fill="url(#coral)"/>
  </g>
</svg>
